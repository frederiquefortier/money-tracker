name: backup

# Nightly encrypted dump, the only backup on the free plan (ADR-016). Needs the variable
# BACKUP_ENABLED = "true" and both secrets.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  # ci.yml, before migrations (ADR-017).
  workflow_call:

jobs:
  dump:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir dump
          supabase db dump --db-url "$DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql --use-copy --data-only
      # Public key only; the private key never touches GitHub.
      - name: Encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          name="money-tracker-$(date -u +%Y-%m-%d).tar.gz.age"
          tar czf - dump | age -r "$AGE_RECIPIENT" -o "$name"
          rm -rf dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
