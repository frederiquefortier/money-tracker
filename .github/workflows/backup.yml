name: backup

# Nightly encrypted dump of the database (security.md, Backups), the only backup on the
# free plan (ADR-016). Off until the repository variable BACKUP_ENABLED is "true" and both
# secrets exist.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  # Called by ci.yml right before migrations are applied (ADR-017).
  workflow_call:

jobs:
  dump:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age
      # supabase db dump runs a pg_dump that matches the server's Postgres version.
      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir dump
          supabase db dump --db-url "$DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql --use-copy --data-only
      # Encrypted to a public key; the private key never touches GitHub.
      - name: Encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          name="money-tracker-$(date -u +%Y-%m-%d).tar.gz.age"
          tar czf - dump | age -r "$AGE_RECIPIENT" -o "$name"
          rm -rf dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
