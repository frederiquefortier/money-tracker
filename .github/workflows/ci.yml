name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Requirement IDs resolve
        run: node .github/scripts/check-requirement-ids.mjs
      - name: No em dashes (CLAUDE.md)
        run: |
          if git grep -n "$(printf '\342\200\224')" -- . ':!docs/00_briefing/notes' ':!*package-lock.json'; then
            exit 1
          fi
      - name: Relative links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path docs/00_briefing/notes './**/*.md'
          fail: true

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # ADR-006: no server module in the browser bundle.
      - name: No server code in the client bundle
        run: |
          if grep -rlE "createServerClient|SUPABASE_URL|sb_publishable_|sb_secret_" dist/client; then
            echo "Server-only code found in dist/client"; exit 1
          fi

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      # The only place the stack runs (ADR-014).
      - name: Start the local stack
        run: supabase db start
      - name: Lint the schema
        run: supabase db lint --level warning --fail-on warning
      - name: pgTAP
        run: supabase test db

  # ADR-044: end-to-end tests against a local stack. Non-blocking while the tests settle:
  # nothing needs it, and a failure does not fail the run. Drop continue-on-error to gate.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      - name: Start the local stack
        working-directory: src
        run: >-
          supabase start -x
          studio,imgproxy,edge-runtime,realtime,storage-api,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Read the local keys
        working-directory: src
        run: |
          supabase status -o env > "$RUNNER_TEMP/status.env"
          value() { grep -E "^$1=" "$RUNNER_TEMP/status.env" | cut -d= -f2- | tr -d '"'; }
          url=$(value API_URL)
          pub=$(value PUBLISHABLE_KEY)
          secret=$(value SECRET_KEY)
          if [ -z "$url" ] || [ -z "$pub" ] || [ -z "$secret" ]; then
            echo "::error::supabase status lacks API_URL, PUBLISHABLE_KEY or SECRET_KEY. It prints:"
            cut -d= -f1 "$RUNNER_TEMP/status.env"
            exit 1
          fi
          echo "::add-mask::$pub"
          echo "::add-mask::$secret"
          {
            echo "E2E_SUPABASE_URL=$url"
            echo "E2E_PUBLISHABLE_KEY=$pub"
            echo "E2E_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - name: Install the app and a browser
        working-directory: src/app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the tests
        working-directory: src/app
        run: npm run e2e
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            src/app/playwright-report
            src/app/test-results
          retention-days: 7

  # One database for development and real use (ADR-017): migrate only from main, after a backup.
  backup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true'
    needs: [docs, app, database]
    uses: ./.github/workflows/backup.yml
    secrets: inherit

  # always(): a skipped backup must fail the run when migrations are pending, not skip it.
  migrate:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.docs.result == 'success' && needs.app.result == 'success' &&
      needs.database.result == 'success'
    needs: [docs, app, database, backup]
    runs-on: ubuntu-latest
    concurrency:
      group: migrate
      cancel-in-progress: false
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      - name: Apply pending migrations
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP: ${{ needs.backup.result }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set; migrations cannot be checked or applied."
            exit 1
          fi
          if [ "$BACKUP" = success ]; then
            supabase db push --db-url "$DB_URL"
            exit 0
          fi
          pending=$(supabase db push --dry-run --db-url "$DB_URL" 2>&1)
          echo "$pending"
          if ! echo "$pending" | grep -q "up to date"; then
            echo "::error::Pending migrations not applied: the backup did not run (result: $BACKUP). Set BACKUP_ENABLED and its secrets, then re-run."
            exit 1
          fi
